<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>OG image template</title>
  <!--
    scripts/og-image.mjs 가 1200x630 으로 열어 assets/og-image.png 로 찍는다.
    문구는 공개 근거로 확인된 표기만 쓴다 (data/projects.js 의 proof 링크와 같은 사실).
    순위·수상은 팀 성과이고, 차트·부문·시점을 함께 적는다. 확인되지 않은 마켓 순위 표기는 쓰지 않는다
    (scripts/check-data.mjs 의 BANNED 가 이 파일도 검사한다).
    폰트는 네트워크 없이 같은 결과가 나오도록 시스템 폰트만 쓴다.
  -->
  <style>
    :root {
      --bg: #e8eeea;
      --bg-deep: #d5e0d9;
      --ink: #15201c;
      --ink-soft: #3d4a44;
      --muted: #5f6e66;
      --line: rgba(21, 32, 28, 0.14);
      --accent: #0b6e63;
      --warm: #c45c26;
      --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 620px 420px at 6% 0%, rgba(18, 148, 135, 0.20), transparent 70%),
        radial-gradient(ellipse 560px 380px at 100% 100%, rgba(196, 92, 38, 0.15), transparent 70%),
        linear-gradient(165deg, #f3f7f4 0%, var(--bg) 48%, var(--bg-deep) 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    .frame {
      position: absolute;
      inset: 0;
      padding: 58px 84px 54px;
      display: flex;
      flex-direction: column;
    }
    .rail {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent) 72%, var(--warm) 72%, var(--warm) 100%);
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }
    .eyebrow {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.26em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 {
      margin-top: 10px;
      font-size: 96px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .role {
      margin-top: 14px;
      font-size: 38px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink-soft);
    }
    .mark {
      width: 150px;
      height: 150px;
      flex: none;
      border-radius: 34px;
      box-shadow: 0 18px 40px rgba(11, 110, 99, 0.22);
    }
    .highlights {
      margin-top: 38px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }
    .label {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    ul {
      list-style: none;
      margin-top: 14px;
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 26px;
      row-gap: 12px;
      font-size: 25px;
      line-height: 1.3;
    }
    li { display: contents; }
    .game {
      font-weight: 700;
      color: var(--ink);
      padding-left: 22px;
      position: relative;
    }
    .game::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.48em;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      background: var(--warm);
    }
    .fact { color: var(--ink-soft); font-weight: 500; }
    .sep { color: var(--warm); font-weight: 700; padding: 0 0.28em; }
    .foot {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .url {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--accent);
    }
    .note {
      font-size: 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="rail" aria-hidden="true"></div>
  <main class="frame">
    <div class="head">
      <div>
        <p class="eyebrow">Portfolio</p>
        <h1>김찬영</h1>
        <p class="role">Unity 게임 클라이언트 개발자</p>
      </div>
      <img class="mark" src="../favicon.svg" alt="">
    </div>

    <section class="highlights">
      <p class="label">참여 출시작 · 팀 성과</p>
      <ul>
        <li>
          <span class="game">고양이 오마카세</span>
          <span class="fact">미국 Google Play 게임 1위 (2024.07)<span class="sep">·</span>Unity Awards Best 2D Visual</span>
        </li>
        <li>
          <span class="game">테일드 데몬 슬레이어: 라이즈</span>
          <span class="fact">구글 플레이 인기 1위 (2023.07)</span>
        </li>
        <li>
          <span class="game">우당탕탕 탐험대</span>
          <span class="fact">약 1개월 MVP 미국 소프트런칭</span>
        </li>
      </ul>
    </section>

    <div class="foot">
      <p class="url">cykim0115.github.io</p>
    </div>
  </main>
</body>
</html>
